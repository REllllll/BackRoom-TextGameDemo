version: '3.8'

services:
  # Unified game service (includes SWI-Prolog and PDDL4J)
  game:
    build:
      context: .
      dockerfile: Dockerfile.game
      # Proxy config (optional; comment out or leave empty if unavailable)
      # Note: if the proxy only listens on 127.0.0.1, containers can't reach it.
      # Configure the proxy to listen on 0.0.0.0:7890 if needed.
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        NO_PROXY: localhost,127.0.0.1
    container_name: liminal-logic-game
    volumes:
      - .:/workspace
      - pddl4j-cache:/root/.gradle
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: swipl -s prolog/liminal_logic_game.pl -g start
    networks:
      - liminal-network
   

networks:
  liminal-network:
    driver: bridge

volumes:
  pddl4j-cache:
    driver: local

