version: '3.8'

services:
  # Dev mode: interactive container; does not auto-start the game
  game-dev:
    build:
      context: .
      dockerfile: Dockerfile.game
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        NO_PROXY: localhost,127.0.0.1
    container_name: liminal-logic-game-dev
    volumes:
      - .:/workspace
      - pddl4j-cache:/root/.gradle
    working_dir: /workspace
    stdin_open: true
    tty: true
    # Dev mode: start a bash shell instead of running the game directly
    command: /bin/bash
    networks:
      - liminal-network
    # Keep container running even when no command is attached
    restart: unless-stopped
    # Port mapping: map container port 8080 to host port 8081
    # Bind to 0.0.0.0 to allow external access
    # If host port 8080 is in use, you can choose another port (e.g. 8081)
    ports:
      - "0.0.0.0:8081:8081"  # host_ip:host_port:container_port

networks:
  liminal-network:
    driver: bridge

volumes:
  pddl4j-cache:
    driver: local

