<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="api-url" content="" id="api-url-meta">
    <title>Liminal Logic: Escape from Level 0 - Playground</title>
    <link rel="stylesheet" href="style.css?v=dev">
</head>
<body>
    <div class="container">
        <header>
            <h1>Liminal Logic: Escape from Level 0</h1>
            <p class="subtitle">A Backrooms escape game built with Prolog and PDDL</p>
        </header>

        <div class="game-layout">
            <!-- Left: game state and commands -->
            <div class="left-panel">
                <!-- Game status panel -->
                <div class="status-panel">
                    <h2>Game Status</h2>
                    <div class="status-item">
                        <span class="label">Current Location:</span>
                        <span id="player-location" class="value">-</span>
                    </div>
                    <div class="status-item">
                        <span class="label">Sanity:</span>
                        <span id="sanity" class="value">100</span>
                        <div class="sanity-bar">
                            <div id="sanity-bar-fill" class="sanity-bar-fill"></div>
                        </div>
                    </div>
                    <div class="status-item">
                        <span class="label">Inventory:</span>
                        <span id="holding-item" class="value">None</span>
                    </div>
                    <div class="status-item">
                        <span class="label">Entity Location:</span>
                        <span id="entity-location" class="value">-</span>
                    </div>
                    <div class="status-item">
                        <span class="label">Game Status:</span>
                        <span id="game-status" class="value">Not started</span>
                    </div>
                </div>

                <!-- Current room info -->
                <div class="room-panel">
                    <h2>Current Room</h2>
                    <div id="room-info">
                        <p id="room-description">Not initialized</p>
                        <div id="room-exits"></div>
                        <div id="room-items"></div>
                    </div>
                </div>

                <!-- Command area -->
                <div class="command-panel">
                    <h2>Commands</h2>
                    <div class="command-input-group">
                        <input type="text" id="command-input" placeholder="Enter command, e.g. move(east), take(flashlight), look" />
                        <button id="execute-btn">Run</button>
                    </div>
                    <div class="command-buttons">
                        <button class="cmd-btn" data-cmd="look">Look</button>
                        <button class="cmd-btn" data-cmd="move(north)">North</button>
                        <button class="cmd-btn" data-cmd="move(south)">South</button>
                        <button class="cmd-btn" data-cmd="move(east)">East</button>
                        <button class="cmd-btn" data-cmd="move(west)">West</button>
                    </div>
                    <div class="command-buttons">
                        <button id="take-item-btn" class="cmd-btn" id="take-item-btn">Take Item</button>
                        <button class="cmd-btn" data-cmd="use(almond_water)">Use Almond Water</button>
                        <button class="cmd-btn" data-cmd="drop(tape_recorder)">Drop Tape Recorder</button>
                    </div>
                    <div class="game-controls">
                        <button id="init-btn" class="control-btn">Initialize Game</button>
                        <button id="refresh-btn" class="control-btn">Refresh Status</button>
                    </div>
                </div>
            </div>

            <!-- Right: map and log -->
            <div class="right-panel">
                <!-- Map visualization -->
                <div class="map-panel">
                    <h2>Map</h2>
                    <div id="map-container">
                        <svg id="map-svg" viewBox="0 0 800 600"></svg>
                    </div>
                </div>

                <!-- Game log -->
                <div class="log-panel">
                    <h2>Game Log</h2>
                    <div id="game-log"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Dynamically load script with timestamp to avoid caching
        const script = document.createElement('script');
        script.src = `app.js?v=${Date.now()}`;
        document.body.appendChild(script);
    </script>
</body>
</html>
